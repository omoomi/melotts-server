name: Qwen Code Dispatch

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      command: ${{ steps.extract_command.outputs.command }}
      additional_context: ${{ steps.extract_command.outputs.additional_context }}
    steps:
      - name: Extract command
        id: extract_command
        uses: actions/github-script@v7
        env:
          EVENT_TYPE: ${{ github.event_name }}.${{ github.event.action }}
          REQUEST: ${{ github.event.comment.body || '' }}
        with:
          script: |
            const eventType = process.env.EVENT_TYPE;
            const request = process.env.REQUEST;
            
            if (eventType === 'pull_request.opened' || eventType === 'pull_request.synchronize') {
              core.setOutput('command', 'review');
              core.setOutput('additional_context', '');
            } else if (request.startsWith('@qwencoder /review')) {
              core.setOutput('command', 'review');
              const additionalContext = request.replace(/^@qwencoder \/review/, '').trim();
              core.setOutput('additional_context', additionalContext);
            } else {
              core.setOutput('command', 'fallthrough');
              core.setOutput('additional_context', '');
            }

  review:
    needs: dispatch
    if: ${{ needs.dispatch.outputs.command == 'review' }}
    uses: ./.github/workflows/qwen-review.yml
    with:
      additional_context: ${{ needs.dispatch.outputs.additional_context }}
    secrets: inherit
