name: Qwen Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@qwencoder'))
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Qwen Code pull request review
        uses: QwenLM/qwen-code-action@v1
        with:
          openai_api_key: ${{ secrets.QWEN_API_KEY }}
          openai_base_url: https://coding-intl.dashscope.aliyuncs.com/v1
          openai_model: qwen-coder-plus-latest
          prompt: |
            Review this pull request for code quality, best practices, potential bugs, and security issues.
            Provide clear, actionable feedback as a PR review.
