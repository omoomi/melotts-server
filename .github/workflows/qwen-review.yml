name: Qwen Code Review

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@qwencoder'))
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Qwen Code pull request review
        uses: QwenLM/qwen-code-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          openai_api_key: ${{ secrets.QWEN_API_KEY }}
          openai_base_url: https://coding-intl.dashscope.aliyuncs.com/v1
          openai_model: qwen-coder-plus-latest
          settings: |
            {"model":{"maxSessionTurns":25},"telemetry":{"enabled":true,"target":"local","outfile":".qwen/telemetry.log"},"mcpServers":{"github":{"command":"docker","args":["run","-i","--rm","-e","GITHUB_PERSONAL_ACCESS_TOKEN","ghcr.io/github/github-mcp-server:v0.18.0"],"includeTools":["add_comment_to_pending_review","create_pending_pull_request_review","pull_request_read","submit_pending_pull_request_review"],"env":{"GITHUB_PERSONAL_ACCESS_TOKEN":"${GITHUB_TOKEN}"}}},"tools":{"core":["run_shell_command(cat)","run_shell_command(echo)","run_shell_command(grep)","run_shell_command(head)","run_shell_command(tail)"]}}
          prompt: /qwen-review
